name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip build twine pytest
          python -m pip install ./packages/devready
      - name: Test
        run: pytest -q packages
      - name: Build and validate
        run: |
          rm -rf packages/*/dist
          for p in devready; do
            (cd "packages/$p" && python -m build)
          done
          twine check packages/*/dist/*
